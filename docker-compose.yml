services:
  postgres:
    image: postgres:17-alpine
    container_name: taglobal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: taglobal
      POSTGRES_USER: taglobal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taglobal_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - taglobal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taglobal -d taglobal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  taglobal-postgres-data:
